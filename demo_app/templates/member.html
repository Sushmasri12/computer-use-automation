<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 30px;
        }

        .container {
            width: 650px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border: 1px solid #ccc;
        }

        .member-info {
            margin-top: 25px;
        }

        .row {
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .label {
            font-weight: bold;
            display: inline-block;
            width: 180px;
        }

        .balance {
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h2>Member Servicing Portal</h2>
</header>

<div class="container">

    <h1>Member Details</h1>

    <div class="member-info">

        <div class="row">
            <span class="label">Member ID:</span>
            <span id="member-id">{{ member_id }}</span>
        </div>

        <div class="row">
            <span class="label">Member Name:</span>
            <span id="member-name">{{ member.name }}</span>
        </div>

        <div class="row">
            <span class="label">Status:</span>
            <span id="member-status">{{ member.status }}</span>
        </div>

        <div class="row">
            <span class="label">Checking Balance:</span>
            <span id="checking-balance">{{ member.checking_balance }}</span>
        </div>

        <div class="row">
            <span class="label">Savings Balance:</span>
            <span id="savings-balance" class="balance">
                {{ member.savings_balance }}
            </span>
        </div>

    </div>

    <a class="back-link" href="/">
        Back to Member Lookup
    </a>

</div>

</body>
</html>
